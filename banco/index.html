<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Dev</title>
</head>
<body>
    <h1>Banco do Desenvolvedor</h1>

    <h2>Saldo atual</h2>
    <p id="saldo">R$ 1.000,00</p>

    <label for="operacao">Escolha a operação:</label>

    <select id="operacao">
        <option value="consultar">Consultar saldo</option>
        <option value="depositar">Depositar</option>
        <option value="sacar">Sacar</option>
        <option value="extrato">Ver extrato</option>
    </select>

    <br><br>

    <label for="valor">Valor (R$):</label>
    <input type="number" id="valor" step="1" placeholder="Digite um valor">

    <br><br>

    <button id="executar">Executar operação</button>

    <h2>Resultado</h2>
    <div id="resultado" ></div>

    <script src="script.js"></script>
</body>
</html>
